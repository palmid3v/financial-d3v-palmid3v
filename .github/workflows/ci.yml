name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
