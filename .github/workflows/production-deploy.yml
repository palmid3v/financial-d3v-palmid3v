name: Production deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: financial-d3v-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      API_SERVICE: ${{ vars.API_SERVICE_NAME }}
      API_RUNTIME_SERVICE_ACCOUNT: ${{ vars.API_RUNTIME_SERVICE_ACCOUNT }}
      BACKUP_SERVICE_ACCOUNT: ${{ vars.BACKUP_SERVICE_ACCOUNT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      BACKUP_JOB_NAME: ${{ vars.BACKUP_JOB_NAME }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
      FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" && test -n "$REGION" && test -n "$AR_REPOSITORY" && test -n "$API_SERVICE"
          test -n "$API_RUNTIME_SERVICE_ACCOUNT" && test -n "$BACKUP_SERVICE_ACCOUNT" && test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_JOB_NAME" && test -n "$PRODUCTION_ORIGIN" && test -n "$FIREBASE_WEB_API_KEY"
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push API image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/financial-d3v-api:$GITHUB_SHA"
          docker build -f deploy/api.Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy API
        run: |
          gcloud run deploy "$API_SERVICE" \
            --image "$API_IMAGE" --region "$REGION" \
            --service-account "$API_RUNTIME_SERVICE_ACCOUNT" --execution-environment gen2 \
            --port 8080 --memory 512Mi --cpu 1 --timeout 60s --min 0 --max 3 \
            --allow-unauthenticated \
            --set-env-vars="APP_ENV=production,FIREBASE_ENABLED=true,FIREBASE_PROJECT_ID=$PROJECT_ID,AUTH_REQUIRED=true,CORS_ALLOWED_ORIGINS=$PRODUCTION_ORIGIN"
      - name: Verify API health
        run: |
          API_URL="$(gcloud run services describe "$API_SERVICE" --region "$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$API_URL/health"
          curl --fail --silent --show-error "$API_URL/ready"
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_FIREBASE_AUTH_ENABLED: "true"
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          npm ci
          npm run build
      - name: Deploy Firebase Hosting
        run: npm exec --yes firebase-tools@latest -- deploy --only hosting --project "$PROJECT_ID"
      - name: Verify protected API
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$PRODUCTION_ORIGIN/api/v1/dashboard?start=2000-01-01T00%3A00%3A00Z&end=2000-02-01T00%3A00%3A00Z")"
          test "$status" = "401"
      - name: Build and push backup image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/financial-d3v-firestore-backup:$GITHUB_SHA"
          docker build -f deploy/backup.Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "BACKUP_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy backup job
        run: |
          gcloud run jobs deploy "$BACKUP_JOB_NAME" --image "$BACKUP_IMAGE" --region "$REGION" \
            --service-account "$BACKUP_SERVICE_ACCOUNT" --tasks 1 --max-retries 2 --task-timeout 1h \
            --set-env-vars="GCP_PROJECT_ID=$PROJECT_ID,BACKUP_BUCKET=$BACKUP_BUCKET,BACKUP_PREFIX=firestore"
